# --- MakeMyQRCode SEO + caching rules (managed block) ----------------
# Inserted by deploy/apply-nginx.sh. Safe to re-run: the script detects
# this marker and will not add a second copy.

# 1. /index.html -> /   (single canonical URL)
if ($request_uri ~ "^/index\.html(/)?(\?|$)") {
    return 301 https://makemyqrcode.com/;
}

# 2. /foo.html/ -> /foo.html   (no trailing slash on pages)
if ($request_uri ~ "^/(.+)\.html/(\?|$)") {
    return 301 https://makemyqrcode.com/$1.html$is_args$args;
}

# 3. HTML must always revalidate
#    add_header is repeated because nginx drops inherited headers once a
#    location block declares one of its own.
location ~* \.html$ {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

# 4. Keep the internal counter endpoint out of search
location = /counter.php {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}

# 5. Long-lived caching for WebP images and woff2 fonts
location ~* \.(webp|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
# --- end MakeMyQRCode rules ------------------------------------------
