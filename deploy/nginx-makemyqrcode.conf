# =====================================================================
#  MakeMyQRCode.com  —  nginx rules for the vhost
#
#  Paste everything below INSIDE the existing `server { ... }` block of
#      /www/server/panel/vhost/nginx/makemyqrcode.com.conf
#  (BT panel: Websites -> makemyqrcode.com -> Config / 配置文件)
#
#  Then ALWAYS validate before reloading:
#      nginx -t && nginx -s reload
#
#  This file is NOT active by itself - it is a copy/paste reference.
# =====================================================================


# --- 1. /index.html  ->  /   (single canonical URL) -------------------
# Catches "/index.html", "/index.html/", and "/index.html?anything".
if ($request_uri ~ "^/index\.html(/)?(\?|$)") {
    return 301 https://makemyqrcode.com/;
}


# --- 2. /foo.html/  ->  /foo.html   (no trailing slash on pages) -----
if ($request_uri ~ "^/(.+)\.html/(\?|$)") {
    return 301 https://makemyqrcode.com/$1.html$is_args$args;
}


# --- 3. HTML must always revalidate ---------------------------------
# Without this, browsers may serve a stale page from cache and your
# updates (and Google's) can lag behind.
location ~* \.html$ {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    # NOTE: nginx drops inherited add_header directives as soon as a
    # location block declares its own, so the security headers are
    # repeated here on purpose.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}


# --- 4. Keep the internal counter endpoint out of search ------------
location = /counter.php {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}


# --- 5. Permissions-Policy for every other response ------------------
# (X-Content-Type-Options / X-Frame-Options / Referrer-Policy / HSTS are
#  already present in the current vhost - only Permissions-Policy is new.)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;


# --- 6. Long-lived caching for the new WebP + font assets -----------
location ~* \.(webp|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
